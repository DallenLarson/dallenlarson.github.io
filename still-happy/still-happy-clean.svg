<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 192" role="img" aria-labelledby="title desc">
  <title id="title">Still Happy — Tracer Yellow, Cleaned Up</title>
  <desc id="desc">Cleaned vector drawing of the Counter-Strike graffiti: six uneven rays, an asymmetric yellow face, two dot eyes, a crooked black grin, and ink drips. All artwork is made from editable SVG paths.</desc>
  <defs>
    <linearGradient id="yellow" x1="99" y1="53" x2="157" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7cd83"/>
      <stop offset=".46" stop-color="#cbbf71"/>
      <stop offset="1" stop-color="#c4b768"/>
    </linearGradient>
    <linearGradient id="ink" x1="119" y1="104" x2="132" y2="139" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242111"/>
      <stop offset="1" stop-color="#17160d"/>
    </linearGradient>
  </defs>
  <!-- Six individual sunburst strokes: asymmetrical, like the game artwork. -->
  <g id="sunburst" fill="#2e2a17">
    <path d="M70.5 48.1 Q69.5 47.9 69.1 48.9 Q68.5 50.6 70.1 52.1 L80.3 62.5 Q82.2 63.2 84.6 61.5 Q86 60.2 84.5 58.4 L75.2 49.5 Q72.2 47.3 70.5 48.1Z"/>
    <path d="M86.3 28.4 Q88.4 27.6 89.3 29.4 L102.1 47.8 Q103 49.2 101.7 50.4 Q99.6 52.1 97.2 50.1 L84.2 32.3 Q83.1 29.9 86.3 28.4Z"/>
    <path d="M110.3 29 Q112.7 27.1 114.1 29.4 L119 45.6 Q119.1 47.1 117.5 47.6 Q115.3 48.2 113.7 46.4 L109.5 31.7 Q109.2 30.1 110.3 29Z"/>
    <path d="M137.3 25.3 Q140.2 23.3 141 26.2 L140.6 42.1 Q140.4 46.8 137.6 47.5 Q135.4 47.6 135.4 44.8 L135.4 28.5 Q135.3 26.3 137.3 25.3Z"/>
    <path d="M168.2 27.2 Q171.5 26.2 171.5 29.3 Q171.4 30.4 170.4 31.9 L158.3 48.7 Q157.1 49.8 155.1 48.3 Q152.3 46.2 153.4 43.7 L165.8 29.1 Q166.8 27.8 168.2 27.2Z"/>
    <path d="M185.4 54.2 Q187.3 53.3 188 55.2 Q189 57.2 187.4 58.9 L178 68.1 Q176.1 69.2 174.1 67.9 Q172 66.5 173.5 64.2 L183.2 55.4 Q184.4 54.5 185.4 54.2Z"/>
  </g>
  <g id="sunburst-paint-drips" fill="#403a1b">
    <path d="M80.3 60.7 Q80.9 65.6 80.7 72.8 Q80.8 73.7 81.4 73 Q82.2 70.7 81.9 67.5 L81.7 62Z"/>
    <path d="M155.2 47.3 Q155.5 51.9 155.3 59.2 Q156.2 61.1 156.6 58.2 L156.6 48Z"/>
    <path d="M176 66.8 Q176.1 70.3 175.9 75.4 Q176.4 76.4 177 74.9 L177.2 67.1Z"/>
  </g>
  <!-- Main silhouette is purposefully not a perfect circle. -->
  <g id="face">
    <path id="face-outer" d="M126.2 50.4
      C145.4 49 160.7 58.8 169.7 74.9
      C177.5 88.2 177.3 107.5 168.6 122.6
      C161 136.7 146.4 145.3 129.2 146.2
      C113.4 146.5 98.5 140.5 89.3 128.3
      C81.8 118.8 78.2 106.6 79.4 94.9
      C79.8 82.4 85.8 71.2 94.3 62.9
      C102.6 55.5 112.6 51.1 126.2 50.4Z"
      fill="#292718"/>
    <path id="face-yellow" d="M126.1 53.7
      C144.1 52.6 158.4 61.8 167.1 76.8
      C174.2 89.3 173.8 106.2 165.7 120.8
      C158.4 133.6 144.2 142.1 128.2 142.4
      C113.5 142.4 100.1 137.1 91.7 126.1
      C84.9 116.9 82.2 105.6 82.7 94.9
      C83.3 83.2 88.4 73.3 96.4 65.4
      C104.3 58 114.1 54.1 126.1 53.7Z"
      fill="url(#yellow)"/>
    <!-- Original has a fine uneven edge around the top, rather than a clean stroke. -->
    <path d="M89.6 76.3 C96.4 60.8 109.3 52.6 125.7 52 C144.7 51.4 160.1 61.2 169.8 78.4"
      stroke="#39341b" stroke-width="1.45" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="M83.9 103.9 C85 118.8 94.7 132.7 109.8 139.1" stroke="#a59850" stroke-width="1.05" stroke-linecap="round" fill="none" opacity=".56"/>
    <path d="M112 140.1 C128.5 146.4 151.3 137.9 160.4 127.5" stroke="#59502a" stroke-width="1.3" fill="none" opacity=".45"/>
  </g>
  <!-- Tiny outline imperfections and asymmetrical spray drips are preserved. -->
  <g id="edge-detail" fill="#38331b">
    <path d="M101.9 59.3 L102.2 67.4 Q102.4 68.4 103.1 67.6 L103.7 57.5Z"/>
    <path d="M104.9 56.8 L105 63.9 Q105.1 64.9 105.9 64.1 L106.2 56.2Z"/>
    <path d="M159.1 65.1 L159.5 74.3 Q159.5 76 160.3 74.4 L160.5 65.6Z"/>
    <path d="M164.6 70.5 L165 77.1 Q165.4 78.1 165.8 76.9 L166.1 71.5Z"/>
    <path d="M158.7 132.7 Q159.6 135.1 159.7 139.6 L159.8 166.2 Q160.2 167.2 160.9 166.5 L161.4 137.2 L161.1 131.2Z"/>
  </g>
  <!-- The left eye sits visibly lower than the right. -->
  <g id="eyes" fill="#1a190f">
    <path d="M103.5 89.5 C107.4 89.1 110.2 92.1 110.2 95.5 C110.1 99.1 107.4 101.7 103.8 101.7 C100.1 101.7 97.7 99.4 97.6 95.9 C97.5 92.3 100 89.7 103.5 89.5Z"/>
    <path d="M150.7 84.1 C154.4 84.1 156.7 86.4 156.9 90 C157.2 93.7 154.8 96.4 151.1 96.5 C147.6 96.7 144.9 94.3 144.8 90.7 C144.6 87 147.4 84.1 150.7 84.1Z"/>
    <path d="M102.8 100.9 L103.3 104.7 Q103.8 105.6 104.1 104.5 L104.6 100.3Z"/>
    <path d="M150.2 95.3 L150.4 102.4 Q150.7 103.5 151.4 102.5 L151.7 96Z"/>
    <path d="M153.9 94.2 L154.1 100.5 Q154.3 101.6 155 100.5 L155.4 93.7Z"/>
  </g>
  <!-- Smile: gently rising top edge, deep irregular crescent, retained thin teeth scratches. -->
  <g id="smile">
    <path d="M98.5 111.4
      C118.8 108.9 139.5 107.1 158.4 105.9
      C158.8 105.9 159.4 106.8 159.2 108.4
      C156.9 118.1 149.1 125.4 140.8 129.3
      C129.5 135.2 116.1 133.1 107.7 126.7
      C102.4 122.7 98.9 117.3 97.8 113.6
      Q97.6 112.1 98.5 111.4Z"
      fill="url(#ink)"/>
    <path d="M98.7 112 C118.9 109.6 139.9 108 158.5 106.7" fill="none" stroke="#3d3820" stroke-width="1.05" stroke-linecap="round" opacity=".72"/>
    <path d="M103 117.2 Q115.8 132.2 130.9 131.6" fill="none" stroke="#50472a" stroke-width=".65" opacity=".26"/>
    <!-- Intentional sparing hatch marks, not raster noise. -->
    <path d="M109.8 116.4 L115.9 126.4 M117.4 114.9 L123.7 128 M126.2 114.2 L132.1 127.9 M135 112.4 L140.4 123.6 M143.6 111.6 L147.5 118.8"
      stroke="#6e6438" stroke-width=".65" stroke-linecap="round" opacity=".38" fill="none"/>
  </g>
  <g id="smile-drips" fill="#292519">
    <path d="M123.7 131.4 Q124 134.7 124 139 Q124.4 140.4 124.9 139 L125.3 132Z"/>
    <path d="M127.2 132 Q127.5 136.2 127.5 140 Q127.7 140.8 128.4 139.6 L128.5 132Z"/>
    <path d="M132.1 131.7 Q132 135.2 132.3 137.4 Q132.8 138.6 133.4 137.3 L133.8 130.7Z"/>
  </g>
</svg>